<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Sign a lien waiver · Kappa Real Estate Investments</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:#F6F7F9;color:#111827;-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:0 auto;padding:24px 16px 48px}
.brand{display:flex;align-items:baseline;gap:10px;margin-bottom:18px}
.brand b{font-size:20px;letter-spacing:-.01em;color:#0E7C86}
.brand span{font-size:13px;color:#6B7280}
.card{background:#fff;border-radius:14px;box-shadow:0 0 0 1px rgba(17,24,39,.06),0 6px 20px rgba(17,24,39,.06);padding:22px 22px 24px;margin-bottom:16px}
h1{font-size:19px;margin:0 0 6px;letter-spacing:-.01em}
.lead{font-size:14px;color:#4B5563;margin:0 0 4px;line-height:1.5}
.doc h2{font-size:17px;margin:0 0 10px}
.notice{background:#F3F4F6;border-radius:8px;padding:10px 12px;font-style:italic;font-size:13px;color:#374151;line-height:1.5}
dl{display:grid;grid-template-columns:minmax(120px,190px) 1fr;gap:6px 14px;margin:14px 0 16px;font-size:14px}
dt{color:#6B7280}dd{margin:0;font-weight:600}
.doc p.para{font-size:14.5px;line-height:1.6;margin:0 0 10px}
label{display:flex;flex-direction:column;gap:5px;font-size:13px;color:#6B7280;font-weight:500}
input[type=text]{border:1px solid #D1D5DB;border-radius:8px;padding:10px 11px;font-size:16px;color:#111827}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.pad{border:1.5px dashed #9CA3AF;border-radius:10px;background:#fff;width:100%;height:150px;touch-action:none;display:block;cursor:crosshair}
.padbar{display:flex;justify-content:space-between;align-items:center;margin:6px 0 14px;font-size:12.5px;color:#6B7280}
.link{background:none;border:none;color:#2563EB;font-size:13px;cursor:pointer;padding:0}
.agree{flex-direction:row;align-items:flex-start;gap:9px;font-size:14px;color:#111827;font-weight:400;line-height:1.45;margin-bottom:16px}
.agree input{margin-top:3px;width:18px;height:18px;accent-color:#2563EB;flex:0 0 auto}
.btn{background:#111827;color:#fff;border:none;border-radius:10px;padding:13px 20px;font-size:16px;font-weight:600;cursor:pointer;width:100%}
.btn:disabled{background:#9CA3AF;cursor:default}
.msg{font-size:14.5px;line-height:1.55}
.ok{color:#047857}.bad{color:#B91C1C}
.small{font-size:12px;color:#9CA3AF;margin-top:14px;line-height:1.5;word-break:break-all}
.hidden{display:none}
@media (max-width:560px){.row{grid-template-columns:1fr}dl{grid-template-columns:1fr}dt{margin-top:6px}}
@media print{body{background:#fff}.no-print{display:none!important}.card{box-shadow:none;padding:0}}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><b>Kappa</b><span>Real Estate Investments</span></div>
  <div id="state" class="card msg">Loading the document…</div>
  <div id="docCard" class="card doc hidden">
    <p class="lead" id="intro"></p>
    <h2 id="title"></h2>
    <div class="notice" id="notice"></div>
    <dl id="fields"></dl>
    <div id="paras"></div>
  </div>
  <div id="signCard" class="card hidden no-print">
    <h1>Sign</h1>
    <div class="row">
      <label>Full name<input type="text" id="name" autocomplete="name"></label>
      <label>Title<input type="text" id="jobtitle" placeholder="e.g. Owner"></label>
    </div>
    <label>Signature</label>
    <canvas class="pad" id="pad" width="700" height="150" aria-label="Draw your signature"></canvas>
    <div class="padbar"><span id="padHint">Draw with your finger or mouse. Or leave it empty to sign with your typed name.</span><button type="button" class="link" id="clear">Clear</button></div>
    <label class="agree"><input type="checkbox" id="agree"><span>I have read this document and I sign it electronically. My electronic signature has the same effect as my handwritten signature.</span></label>
    <button class="btn" id="sign" disabled>Sign the document</button>
    <p class="small" id="err"></p>
  </div>
  <p class="small" id="foot"></p>
</div>
<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  function sha256(str) {
    var K = [0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
    var H = [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
    var bytes = Array.prototype.slice.call(new TextEncoder().encode(String(str)));
    var bitLen = bytes.length * 8;
    bytes.push(0x80);
    while (bytes.length % 64 !== 56) bytes.push(0);
    for (var q = 7; q >= 0; q--) bytes.push(q >= 4 ? 0 : (bitLen >>> (q * 8)) & 0xff);
    var rotr = function (x, n) { return (x >>> n) | (x << (32 - n)); };
    var w = new Array(64);
    for (var off = 0; off < bytes.length; off += 64) {
      for (var i = 0; i < 16; i++) w[i] = (bytes[off + i * 4] << 24) | (bytes[off + i * 4 + 1] << 16) | (bytes[off + i * 4 + 2] << 8) | bytes[off + i * 4 + 3];
      for (i = 16; i < 64; i++) {
        var s0 = rotr(w[i - 15], 7) ^ rotr(w[i - 15], 18) ^ (w[i - 15] >>> 3);
        var s1 = rotr(w[i - 2], 17) ^ rotr(w[i - 2], 19) ^ (w[i - 2] >>> 10);
        w[i] = (w[i - 16] + s0 + w[i - 7] + s1) | 0;
      }
      var a = H[0], b = H[1], c = H[2], d = H[3], e = H[4], f = H[5], g = H[6], h = H[7];
      for (i = 0; i < 64; i++) {
        var t1 = (h + (rotr(e, 6) ^ rotr(e, 11) ^ rotr(e, 25)) + ((e & f) ^ (~e & g)) + K[i] + w[i]) | 0;
        var t2 = ((rotr(a, 2) ^ rotr(a, 13) ^ rotr(a, 22)) + ((a & b) ^ (a & c) ^ (b & c))) | 0;
        h = g; g = f; f = e; e = (d + t1) | 0; d = c; c = b; b = a; a = (t1 + t2) | 0;
      }
      H = [H[0] + a, H[1] + b, H[2] + c, H[3] + d, H[4] + e, H[5] + f, H[6] + g, H[7] + h].map(function (v) { return v | 0; });
    }
    return H.map(function (v) { return (v >>> 0).toString(16).padStart(8, "0"); }).join("");
  }
  function show(text, cls) { var s = $("state"); s.textContent = text; s.className = "card msg " + (cls || ""); s.classList.remove("hidden"); }
  var hash = new URLSearchParams(String(location.hash || "").replace(/^#/, ""));
  var token = hash.get("t") || "";
  var api = hash.get("a") || "";
  var okApi = /^https:\/\/[a-z0-9-]+(\.[a-z0-9-]+)*\.n8n\.cloud\/webhook(-test)?\/[A-Za-z0-9_\-\/]+$/.test(api);
  if (!token || !okApi) { show("This signing link isn't complete. Open it again from the email you received.", "bad"); return; }
  var doc = null, sig = "", drawn = false;

  fetch(api + "-doc?t=" + encodeURIComponent(token), { headers: { Accept: "application/json" } })
    .then(function (r) { if (r.status === 404) throw new Error("gone"); if (!r.ok) throw new Error("http " + r.status); return r.json(); })
    .then(function (j) {
      if (!j || j.ok === false || !j.doc) throw new Error("gone");
      doc = j.doc;
      var body = { title: doc.title, notice: doc.notice, fields: doc.fields, paras: doc.paras };
      if (!doc.hash || sha256(JSON.stringify(body)) !== doc.hash) { show("This document can't be verified, so it can't be signed. Please contact Kappa.", "bad"); return; }
      if (j.status === "void") { show("This request was cancelled. If you were sent a newer one, use the link in that email.", "bad"); return; }
      renderDoc(j);
      if (j.status === "signed") { show("This document was signed" + (j.signedAt ? " on " + new Date(j.signedAt).toLocaleString() : "") + ". Thank you.", "ok"); $("foot").textContent = "Document fingerprint (SHA-256): " + doc.hash; return; }
      $("state").classList.add("hidden");
      $("signCard").classList.remove("hidden");
      $("name").value = j.toName || "";
      $("foot").textContent = "Document fingerprint (SHA-256): " + doc.hash;
    })
    .catch(function (e) { show(e.message === "gone" ? "This signing link isn't valid anymore. If you need to sign, ask Kappa to send a new one." : "Couldn't load the document. Check your connection and try again.", "bad"); });

  function renderDoc(j) {
    $("intro").textContent = (j.from ? j.from + " at " : "") + "Kappa Real Estate Investments asks " + (j.claimant || "you") + " to sign this lien waiver.";
    $("title").textContent = doc.title;
    $("notice").textContent = doc.notice;
    var dl = $("fields");
    doc.fields.forEach(function (f) {
      var dt = document.createElement("dt"); dt.textContent = f[0];
      var dd = document.createElement("dd"); dd.textContent = f[1];
      dl.appendChild(dt); dl.appendChild(dd);
    });
    doc.paras.forEach(function (p) { var el = document.createElement("p"); el.className = "para"; el.textContent = p; $("paras").appendChild(el); });
    $("docCard").classList.remove("hidden");
  }

  // the signature pad
  var pad = $("pad"), ctx = pad.getContext ? pad.getContext("2d") : null, on = false;
  function at(e) { var r = pad.getBoundingClientRect(); return [(e.clientX - r.left) * pad.width / (r.width || pad.width), (e.clientY - r.top) * pad.height / (r.height || pad.height)]; }
  if (ctx) {
    pad.addEventListener("pointerdown", function (e) { on = true; var p = at(e); ctx.lineWidth = 3; ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.strokeStyle = "#111827"; ctx.beginPath(); ctx.moveTo(p[0], p[1]); try { pad.setPointerCapture(e.pointerId); } catch (er) {} e.preventDefault(); });
    pad.addEventListener("pointermove", function (e) { if (!on) return; var p = at(e); ctx.lineTo(p[0], p[1]); ctx.stroke(); drawn = true; });
    var end = function () { if (!on) return; on = false; if (drawn) sig = pad.toDataURL("image/png"); };
    pad.addEventListener("pointerup", end); pad.addEventListener("pointercancel", end); pad.addEventListener("pointerleave", end);
  }
  $("clear").addEventListener("click", function () { if (ctx) ctx.clearRect(0, 0, pad.width, pad.height); drawn = false; sig = ""; });
  function check() { $("sign").disabled = !($("agree").checked && $("name").value.trim()); }
  $("agree").addEventListener("change", check);
  $("name").addEventListener("input", check);

  $("sign").addEventListener("click", function () {
    var btn = $("sign");
    btn.disabled = true; btn.textContent = "Signing…"; $("err").textContent = "";
    var body = { t: token, hash: doc.hash, name: $("name").value.trim(), title: $("jobtitle").value.trim(), signature: sig, consent: true, ua: navigator.userAgent, tz: (Intl.DateTimeFormat().resolvedOptions().timeZone || "") };
    fetch(api + "-sign", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) })
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { if (!r.ok || j.ok === false) throw new Error(j.error || ("http " + r.status)); return j; }); })
      .then(function () {
        $("signCard").classList.add("hidden");
        show("Signed. Thank you, " + body.name + ". Kappa has the signed document and you'll get a copy by email.", "ok");
        var p = document.createElement("button"); p.className = "link no-print"; p.textContent = "Print or save a copy"; p.style.marginTop = "10px"; p.onclick = function () { window.print(); };
        $("state").appendChild(document.createElement("br")); $("state").appendChild(p);
      })
      .catch(function (e) { btn.disabled = false; btn.textContent = "Sign the document"; $("err").textContent = "Couldn't sign: " + e.message + ". Please try again."; });
  });
})();
</script>
</body>
</html>
