<style>*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}body{background:#EDF1F5;color:#15284B;font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none}input[type=number]{-moz-appearance:textfield}::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:#C3CDD9;border-radius:3px}@media print{.no-print{display:none!important}body,*:not(.keep-color){background:white!important;color:black!important;box-shadow:none!important}}
.top-summary-grid{grid-template-columns:minmax(220px,1fr) 2fr}
.kpi-grid-4{grid-template-columns:repeat(4,1fr)}
.kpi-row-3{grid-template-columns:repeat(3,1fr)}
.map-resources-grid{grid-template-columns:1.4fr 1fr}
.main-two-col{grid-template-columns:1fr 1fr}
.actuals-two-col{grid-template-columns:1.6fr 1fr}
.field-grid-2{grid-template-columns:1fr 1fr}
.field-grid-3{grid-template-columns:1fr 1fr 1fr}
.ledger-add-row{grid-template-columns:130px 150px 1fr 110px 40px}
.ledger-edit-row{grid-template-columns:130px 150px 1fr 110px auto}
.ledger-row{grid-template-columns:96px 150px 1fr 110px 26px 26px 26px}
@media (max-width:900px){
.top-summary-grid{grid-template-columns:1fr}
.map-resources-grid{grid-template-columns:1fr}
.main-two-col{grid-template-columns:1fr}
.actuals-two-col{grid-template-columns:1fr}
}
@media (max-width:640px){
.kpi-grid-4{grid-template-columns:repeat(2,1fr)}
.kpi-row-3{grid-template-columns:repeat(2,1fr)}
.ledger-add-row{grid-template-columns:1fr 1fr;grid-template-areas:"desc desc" "date cat" "amt amt" "add add";row-gap:6px}
.ledger-add-row>*:nth-child(1){grid-area:date}
.ledger-add-row>*:nth-child(2){grid-area:cat}
.ledger-add-row>*:nth-child(3){grid-area:desc}
.ledger-add-row>*:nth-child(4){grid-area:amt}
.ledger-add-row>*:nth-child(5){grid-area:add;width:100%}
.ledger-edit-row{grid-template-columns:1fr 1fr;grid-template-areas:"label label" "date cat" "amt amt" "btns btns";row-gap:6px}
.ledger-edit-row>*:nth-child(1){grid-area:date}
.ledger-edit-row>*:nth-child(2){grid-area:cat}
.ledger-edit-row>*:nth-child(3){grid-area:label}
.ledger-edit-row>*:nth-child(4){grid-area:amt}
.ledger-edit-row>*:nth-child(5){grid-area:btns}
.ledger-row{grid-template-columns:1fr auto auto auto;grid-template-areas:"label edit attach del" "date date amt amt" "cat cat cat cat";row-gap:4px}
.ledger-row>*:nth-child(1){grid-area:date}
.ledger-row>*:nth-child(2){grid-area:cat}
.ledger-row>*:nth-child(3){grid-area:label}
.ledger-row>*:nth-child(4){grid-area:amt}
.ledger-row>*:nth-child(5){grid-area:edit}
.ledger-row>*:nth-child(6){grid-area:attach}
.ledger-row>*:nth-child(7){grid-area:del}
}
@media (max-width:480px){
.field-grid-2,.field-grid-3{grid-template-columns:1fr}
.kappa-root{padding:16px 12px!important}
}
.kpi-tooltip{position:relative;cursor:help}
.kpi-tooltip::after{content:attr(data-tip);position:absolute;left:50%;bottom:calc(100% + 8px);transform:translateX(-50%) translateY(4px);background:rgba(15,23,28,0.98);color:#e8f4f6;padding:8px 10px;border-radius:8px;font-size:11px;font-weight:500;width:190px;text-align:left;line-height:1.4;box-shadow:0 6px 20px rgba(0,0,0,0.5);border:1px solid rgba(255,255,255,0.15);z-index:80;pointer-events:none;opacity:0;visibility:hidden;transition:opacity .15s,transform .15s}
.kpi-tooltip:hover::after{opacity:1;visibility:visible;transform:translateX(-50%) translateY(0)}
@media (hover:none){.kpi-tooltip::after{display:none}}
  .grade-explain {
    position: fixed; left: 248px; top: 50%;
    transform: translateY(-50%) translateX(-12px);
    width: 296px; max-height: 90vh; overflow-y: auto; z-index: 150;
    background: #ffffff; border: 1px solid #C9D3DE; border-radius: 4px;
    box-shadow: 0 12px 32px rgba(21,40,75,.16);
    padding: 15px 16px; display: flex; flex-direction: column; gap: 12px;
    opacity: 0; visibility: hidden; pointer-events: none;
    transition: opacity .18s ease, transform .18s ease, visibility .18s;
    font-family: 'IBM Plex Sans', system-ui, sans-serif; text-align: left; color: #15284B;
  }
  .grade-explain.is-on { opacity: 1; visibility: visible; transform: translateY(-50%) translateX(0); }
  .ge-title { font-size: 14px; font-weight: 600; color: #15284B; }
  .ge-sec { display: flex; flex-direction: column; gap: 5px; border-top: 1px solid #eef2f7; padding-top: 10px; }
  .ge-h { font-size: 12px; font-weight: 600; color: #4E5F7A; font-family: 'IBM Plex Sans Condensed', 'IBM Plex Sans', sans-serif; }
  .ge-note { font-size: 11.5px; color: #4E5F7A; line-height: 1.45; }
